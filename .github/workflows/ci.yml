name: CI

on:
  push:
    branches: [master, chatterino-cmake]
  pull_request:
    branches: [master, chatterino-cmake]

jobs:
  build:
    name: Build
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        config: [shared, static]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v1
      with:
        path: ../Qt
        key: ${{runner.os}}-QtCache

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        cache-key-prefix: ${{ runner.os }}-QtCache

    - name: Git Checkout
      uses: actions/checkout@v1

    - name: Build
      run: |
        qmake -v
        ./configure -verbose -config ${{matrix.config}}
        make -j2
      if: matrix.os != 'windows-latest'

    - name: Build
      run: |
        call "%programfiles(x86)%\Microsoft Visual Studio\2019\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        qmake -v
        qmake -config verbose -config ${{matrix.config}}
        set CL=/MP
        nmake
      shell: cmd
      if: matrix.os == 'windows-latest'

    - name: Run Tests
      run: make check
      if: matrix.os == 'ubuntu-latest'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Cache Qt
      id: cache-qt
      uses: actions/cache@v1
      with:
        path: ../Qt
        key: ${{runner.os}}-QtCache

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        cache-key-prefix: ${{ runner.os }}-QtCache

    - name: Install LCOV
      run: sudo apt install lcov

    - name: Git Checkout
      uses: actions/checkout@v1

    - name: Configure
      run: |
        qmake -v
        ./configure -verbose -config coverage -config no_examples

    - name: Build
      run: make -j2

    - name: Measure Coverage
      run: |
        make coverage
        cat coverage/Irc*.cov > coverage/lcov.info

    - name: Upload Coverage
      uses: codecov/codecov-action@v1.0.6
      with:
        token: ${{secrets.CODECOV_TOKEN}}
        file: coverage/lcov.info
